[project]
name = "assistente-telegram-voz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcu-Loreto", email = "mlbonfim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "elevenlabs>=2.68.0",
    "openai>=3.14.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
assistente-telegram-voz = "assistente_telegram_voz:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
