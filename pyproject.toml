[project]
name = "assistente-telegram-voz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcu-Loreto", email = "mlbonfim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "elevenlabs>=2.68.0",
    "openai>=3.14.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
]

[project.scripts]
assistente-telegram-voz = "assistente_telegram_voz:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# === PyTorch CPU-only ===
# O torch do PyPI, no Linux, arrasta ~15 pacotes NVIDIA/CUDA + triton como
# dependências diretas (marker sys_platform == 'linux'), inflando o ambiente
# para ~6 GB. Como não usamos GPU (embeddings rodam em CPU), apontamos o torch
# para o índice CPU-only do PyTorch, cujos wheels "+cpu" não têm essas deps.
# Isso vale tanto para o dev local quanto para a imagem Docker.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
